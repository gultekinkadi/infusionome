name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Testler ve APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Hata kaydını depoya yaz (yalnızca başarısızlıkta)
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "build.log yok" > /tmp/log/build.log
          find app/build -name '*.xml' -path '*test-results*' -exec cp {} /tmp/log/ \; 2>/dev/null || true
          git checkout --orphan build-log
          git rm -rfq . || true
          cp /tmp/log/* .
          git add -A
          git commit -qm "Derleme hatası kaydı: ${GITHUB_SHA}"
          git push -f origin build-log

      - name: APK'yı yeniden adlandır
        run: |
          VER=$(grep versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "infusionome-$VER.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: infusionome-apk
          path: infusionome-*.apk

      - name: "Sürüm sayfasına koy (indirilebilir APK)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: "infusionome ${{ env.VER }} (son derleme)"
          body: "Telefona kurmak için aşağıdaki .apk dosyasını indirin. Commit: ${{ github.sha }}"
          files: infusionome-*.apk
          make_latest: true
