name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Testler
        run: gradle --no-daemon testDebugUnitTest

      - name: APK derle
        run: gradle --no-daemon assembleDebug

      - name: APK'yı yeniden adlandır
        run: |
          VER=$(grep versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/debug/app-debug.apk "infusionome-$VER.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: infusionome-apk
          path: infusionome-*.apk

      - name: "Sürüm sayfasına koy (indirilebilir APK)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: son-surum
          name: "infusionome ${{ env.VER }} (son derleme)"
          body: "Telefona kurmak için aşağıdaki .apk dosyasını indirin. Commit: ${{ github.sha }}"
          files: infusionome-*.apk
          make_latest: true
