name: Ekran görüntüleri

on:
  push:
    branches: [ekran]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK derle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          /tmp/gradle-8.13/bin/gradle --no-daemon assembleDebug

      - name: KVM aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=always"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde ekran görüntüsü al
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/screens.sh > shots.log 2>&1 || true

      - name: Görüntüleri depoya yaz
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots/* /tmp/out/ 2>/dev/null || true
          cp shots.log /tmp/out/ 2>/dev/null || echo "log yok" > /tmp/out/shots.log
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan ekran-sonuc
          git rm -rfq . || true
          rm -rf app gradle .github
          cp /tmp/out/* .
          git add -A
          git commit -qm "Ekran görüntüleri: ${GITHUB_SHA}"
          git push -f origin ekran-sonuc
